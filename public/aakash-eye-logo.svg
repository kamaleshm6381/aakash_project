  <line x1="36" y1="18" x2="31" y2="6" stroke="#075985" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="48" y1="15" x2="46" y2="3" stroke="#075985" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="60" y1="14" x2="60" y2="2" stroke="#075985" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="72" y1="15" x2="74" y2="3" stroke="#075985" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="84" y1="18" x2="89" y2="6" stroke="#075985" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="96" y1="23" x2="102" y2="10" stroke="#075985" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Upper Eyelid Arch -->
